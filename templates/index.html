<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelCompare | Cari Penawaran Terbaik</title>
    
    <script src="https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        /* --- CSS GLOBAL --- */
        :root {
            --primary-color: #007bff;
            --primary-dark: #0056b3;
            --secondary-color: #ff6f00;
            --light-bg: #f4f7f6;
            --white: #ffffff;
            --text-dark: #333;
            --text-light: #666;
            --border-color: #e0e0e0;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --card-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--light-bg);
            margin: 0;
            padding: 20px;
            color: var(--text-dark);
        }
        .search-container {
            max-width: 900px;
            margin: 20px auto;
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        h1 {
            text-align: center;
            color: var(--primary-dark);
            padding: 0 20px;
            margin-top: 10px;
        }

        /* --- TABS --- */
        .tabs { display: flex; background-color: #f9f9f9; border-bottom: 1px solid var(--border-color); }
        .tab-link { flex: 1; padding: 18px 10px; border: none; background: none; cursor: pointer; font-size: 16px; font-weight: 600; color: var(--text-light); transition: all 0.3s; border-bottom: 3px solid transparent; }
        .tab-link:hover { color: var(--primary-dark); background: #f0f0f0; }
        .tab-link.active { color: var(--primary-color); border-bottom: 3px solid var(--primary-color); background: #fff; }
        .tab-link[data-tab="combo"].active { color: var(--secondary-color); border-bottom-color: var(--secondary-color); color: var(--secondary-color); }
        .tab-content { padding: 25px 30px; display: none; }
        .tab-content.active { display: block; }

        /* --- FORM --- */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; width: 100%; }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label { font-weight: 600; margin-bottom: 6px; font-size: 14px; color: var(--text-dark); }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 15px; box-sizing: border-box; background-color: #fff; transition: border-color 0.2s; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary-color); }

        /* --- BUTTONS --- */
        .submit-button { grid-column: 1 / -1; background-color: var(--primary-color); color: var(--white); padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 15px; transition: background-color 0.3s, transform 0.1s; }
        .submit-button:hover { background-color: var(--primary-dark); }
        .submit-button:active { transform: scale(0.98); }
        #combo-form .submit-button { background-color: var(--secondary-color); }
        #combo-form .submit-button:hover { background-color: #d95e00; }

        /* --- STYLE FILTER BINTANG --- */
        .star-rating { display: flex; flex-wrap: wrap; gap: 10px; }
        .star-rating input[type="checkbox"] { display: none; }
        .star-rating label { display: inline-flex; align-items: center; justify-content: center; padding: 10px 18px; background-color: #f0f2f5; color: #555; border: 1px solid #ddd; border-radius: 25px; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.2s ease; user-select: none; }
        .star-rating label:hover { background-color: #e4e6e9; }
        .star-rating input[type="checkbox"]:checked + label { background-color: var(--primary-color); color: white; border-color: var(--primary-dark); box-shadow: 0 2px 5px rgba(0, 123, 255, 0.3); }

        /* --- RESULTS --- */
        .results-container { max-width: 900px; margin: 30px auto; }
        .results-container h2 { font-size: 20px; margin-bottom: 15px; color: var(--text-dark); }
        #results-content { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        #results-content.list-mode { display: flex; flex-direction: column; }

        /* --- FLIGHT CARD --- */
        .flight-card-wrapper { background: white; border-radius: 10px; box-shadow: var(--card-shadow); border: 1px solid var(--border-color); overflow: hidden; transition: transform 0.2s; }
        .flight-card-wrapper:hover { transform: translateY(-2px); border-color: var(--primary-color); }
        .flight-card-main { display: flex; padding: 20px; align-items: center; justify-content: space-between; width: 100%; box-sizing: border-box; }
        .airline-info { display: flex; align-items: center; gap: 15px; width: 25%; }
        .airline-logo { width: 50px; height: 50px; object-fit: contain; }
        .airline-name { font-weight: 700; font-size: 16px; color: var(--text-dark); line-height: 1.2; }
        .airline-cluster { font-size: 12px; color: #888; display: block; margin-top: 2px; }
        .flight-route { display: flex; align-items: center; justify-content: center; gap: 20px; flex: 1; text-align: center; }
        .route-time { font-size: 18px; font-weight: 700; color: var(--text-dark); }
        .route-city { font-size: 14px; color: var(--text-light); background: #f1f1f1; padding: 2px 8px; border-radius: 4px; margin-top: 4px; display: inline-block; }
        .route-duration { display: flex; flex-direction: column; align-items: center; min-width: 100px; }
        .duration-text { font-size: 12px; color: #888; margin-bottom: 4px; }
        .duration-line { width: 100%; height: 2px; background: #ddd; position: relative; }
        .duration-line::after { content: "✈"; position: absolute; top: -8px; left: 50%; transform: translateX(-50%); color: #aaa; font-size: 14px; }
        .flight-action { display: flex; flex-direction: column; align-items: flex-end; width: 20%; }
        .flight-price { font-size: 20px; font-weight: 700; color: #ff5e00; margin-bottom: 5px; }
        
        /* Tombol PDF & Detail */
        .btn-group-action { display: flex; gap: 15px; margin-top: 5px; }
        .btn-toggle-detail { color: var(--primary-color); background: none; border: none; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; padding: 0; }
        .btn-toggle-detail:hover { text-decoration: underline; }
        .btn-pdf { color: #dc3545; background: none; border: none; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; padding: 0; display: flex; align-items: center; gap: 4px; }
        .btn-pdf:hover { text-decoration: underline; color: #a71d2a; }

        /* --- HOTEL CARD --- */
        .hotel-card { background: white; border-radius: 10px; box-shadow: var(--card-shadow); border: 1px solid var(--border-color); overflow: hidden; transition: transform 0.2s; display: flex; flex-direction: column; }
        .hotel-card:hover { transform: translateY(-2px); border-color: var(--primary-color); }
        .hotel-card-image { width: 100%; height: 180px; object-fit: cover; background-color: #eee; }
        .hotel-card-content { padding: 15px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
        .hotel-name { font-weight: 700; font-size: 16px; color: var(--text-dark); margin: 0; line-height: 1.4; }
        .hotel-stars { color: #ffc107; font-size: 14px; margin-bottom: 5px; }
        .hotel-city { font-size: 13px; color: #666; display: flex; align-items: center; gap: 4px; }
        .hotel-footer { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; padding-top: 10px; border-top: 1px solid #f0f0f0; }
        .hotel-price { font-size: 16px; font-weight: 700; color: #ff5e00; }
        
        /* --- COMBO CARD --- */
        .combo-card-wrapper { background: white; border-radius: 10px; box-shadow: var(--card-shadow); border: 1px solid var(--border-color); overflow: hidden; transition: transform 0.2s; margin-bottom: 20px; }
        .combo-card-wrapper:hover { transform: translateY(-2px); border-color: var(--secondary-color); }
        .combo-card-main { display: flex; width: 100%; box-sizing: border-box; min-height: 100px; }
        .combo-details-main { flex: 1; padding: 20px; display: flex; flex-direction: column; justify-content: center; gap: 15px; border-right: 1px solid #eee; border-left: 6px solid var(--secondary-color); }
        .combo-cluster-tag { display: inline-block; background-color: #fff3e0; color: var(--secondary-color); padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 700; margin-bottom: 5px; width: fit-content; }
        .combo-flight-row { display: flex; align-items: center; gap: 15px; padding-bottom: 12px; border-bottom: 1px dashed #eee; }
        .combo-airline-logo { width: 30px; height: 30px; object-fit: contain; }
        .combo-flight-text { font-size: 14px; color: var(--text-dark); display: flex; align-items: center; gap: 8px; }
        .combo-hotel-row { display: flex; align-items: center; gap: 10px; }
        .combo-hotel-icon { font-size: 18px; }
        .combo-hotel-name { font-weight: 700; font-size: 15px; color: var(--text-dark); }
        .combo-hotel-star { color: #ffc107; font-size: 12px; }
        .combo-price-section { width: 200px; background: #fcfcfc; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; padding: 20px; gap: 10px; }
        .combo-price-label { font-size: 12px; color: #888; text-align: right; }
        .combo-price { font-size: 22px; font-weight: 700; color: var(--secondary-color); }
        
        .btn-toggle-combo { color: var(--secondary-color); background: none; border: none; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; padding: 0; }
        .btn-toggle-combo:hover { text-decoration: underline; }

        /* General Details */
        .detail-item { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
        .detail-label { font-size: 11px; color: #888; text-transform: uppercase; font-weight: 600; }
        .detail-value { font-weight: 500; color: #333; display: flex; align-items: center; gap: 6px; }
        .detail-panel { display: none; background-color: #f9f9f9; border-top: 1px dashed #e0e0e0; padding: 15px 20px; font-size: 14px; color: #555; }
        .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .combo-detail-panel { display: none; background-color: #fcfcfc; border-top: 1px dashed #e0e0e0; padding: 20px; font-size: 14px; color: #555; }
        .combo-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .combo-detail-col h4 { font-size: 14px; font-weight: 700; color: var(--text-dark); margin-top: 0; margin-bottom: 10px; border-bottom: 2px solid #eee; padding-bottom: 5px; }
        
        .hotel-detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .rating-box { display: flex; align-items: center; gap: 10px; }
        .rating-score { background-color: #003580; color: white; padding: 6px 8px; border-radius: 6px; font-weight: 700; font-size: 14px; border-bottom-left-radius: 0; }
        .rating-text { font-size: 14px; font-weight: 600; color: var(--primary-dark); }
        .rating-count { font-size: 12px; color: #888; font-weight: normal; }
        .amenities-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .amenity-tag { font-size: 12px; background: white; border: 1px solid #ddd; padding: 4px 10px; border-radius: 15px; color: #555; display: flex; align-items: center; gap: 5px; }

        @media (max-width: 768px) {
            .flight-card-main, .combo-card-main { flex-direction: column; height: auto; }
            .airline-info, .flight-route, .flight-action { width: 100%; justify-content: space-between; flex-direction: row; }
            .combo-details-main { border-right: none; border-bottom: 1px solid #eee; border-left: none; border-top: 4px solid var(--secondary-color); }
            .combo-price-section { width: 100%; align-items: center; flex-direction: row; justify-content: space-between; padding: 15px; }
            .combo-detail-grid { grid-template-columns: 1fr; gap: 15px; }
            #results-content { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    
    <datalist id="airport-list">
        <option value="SUB">Surabaya</option>
        <option value="CGK">Jakarta (Soekarno Hatta)</option>
        <option value="DPS">Bali (Denpasar)</option>
        <option value="HLP">Jakarta (Halim)</option>
        <option value="JKT">Jakarta (Semua Bandara)</option>
        <option value="SIN">Singapura</option>
        <option value="SRG">Semarang</option>
        <option value="KUL">Kuala Lumpur</option>
        <option value="BKK">Bangkok</option>
        <option value="JOG">Yogyakarta</option>
        <option value="UPG">Makassar</option>
    </datalist>

    <datalist id="city-list">
        <option value="Surabaya">Surabaya</option>
        <option value="Jakarta">Jakarta</option>
        <option value="Bali">Bali</option>
        <option value="Singapura">Singapura</option>
        <option value="Semarang">Semarang</option>
        <option value="Yogyakarta">Yogyakarta</option>
        <option value="Makassar">Makassar</option>
        <option value="Kuala Lumpur">Kuala Lumpur</option>
        <option value="Bangkok">Bangkok</option>
    </datalist>

    <h1>TravelCompare</h1>

    <div class="search-container">
        <div class="tabs">
            <button class="tab-link active" onclick="openTab(event, 'flights')" data-tab="flights">Flights</button>
            <button class="tab-link" onclick="openTab(event, 'hotels')" data-tab="hotels">Hotels</button>
            <button class="tab-link" onclick="openTab(event, 'combo')" data-tab="combo">Combo</button>
        </div>

        <div id="flights" class="tab-content active">
            <form id="flight-form" onsubmit="runFilter(event, 'flight')">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="f-origin">Asal (Kota atau Bandara)</label>
                        <input type="text" id="f-origin" name="origin" list="airport-list" placeholder="Ketik 'Surabaya' atau 'SUB'">
                    </div>
                    <div class="form-group">
                        <label for="f-destination">Tujuan (Kota atau Bandara)</label>
                        <input type="text" id="f-destination" name="destination" list="airport-list" placeholder="Ketik 'Jakarta' atau 'CGK'">
                    </div>
                    <div class="form-group">
                        <label for="f-date">Tanggal Berangkat</label>
                        <input type="date" id="f-date" name="date">
                    </div>
                    <div class="form-group">
                        <label for="f-airline">Maskapai</label>
                        <select id="f-airline" name="airline">
                            <option value="">Semua Maskapai</option>
                            <option value="Garuda">Garuda Indonesia</option>
                            <option value="Lion">Lion Air</option>
                            <option value="Citilink">Citilink</option>
                            <option value="Batik">Batik Air</option>
                            <option value="AirAsia">AirAsia</option>
                            <option value="Super Air Jet">Super Air Jet</option>
                            <option value="Pelita">Pelita Air</option>
                            <option value="TransNusa">TransNusa</option>
                            <option value="Sriwijaya">Sriwijaya Air</option>
                            <option value="Wings">Wings Air</option>
                            <option value="Scoot">Scoot</option>
                            <option value="Singapore">Singapore Airlines</option>
                            <option value="Malaysia">Malaysia Airlines</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="f-min-price">Harga Minimum</label>
                        <input type="number" id="f-min-price" name="min_price" placeholder="Contoh: 1000000">
                    </div>
                    <div class="form-group">
                        <label for="f-max-price">Harga Maksimum</label>
                        <input type="number" id="f-max-price" name="max_price" placeholder="Contoh: 3000000">
                    </div>
                    <div class="form-group full-width">
                        <label for="f-cluster">Kategori Penerbangan</label>
                        <select id="f-cluster" name="cluster_label">
                            <option value="">Semua Kategori</option>
                            <option value="Budget Flight">Budget Flight</option>
                            <option value="Mid-range Flight">Mid-range Flight</option>
                            <option value="High-end Flight">High-end Flight</option>
                        </select>
                    </div>
                    <button type="submit" class="submit-button">Cari Penerbangan</button>
                </div>
            </form>
        </div>

        <div id="hotels" class="tab-content">
            <form id="hotel-form" onsubmit="runFilter(event, 'hotel')">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="h-city">Kota</label>
                        <input type="text" id="h-city" name="city" list="city-list" placeholder="Ketik nama kota... (cth: Surabaya)">
                    </div>
                    <div class="form-group">
                        <label for="h-checkin">Tanggal Check-in</label>
                        <input type="date" id="h-checkin" name="checkin_date">
                    </div>
                    <div class="form-group">
                        <label for="h-checkout">Tanggal Check-out</label>
                        <input type="date" id="h-checkout" name="checkout_date">
                    </div>
                    <div class="form-group">
                        <label for="h-min-price">Total Harga Min.</label>
                        <input type="number" id="h-min-price" name="min_total_price" placeholder="Contoh: 1000000">
                    </div>
                    <div class="form-group">
                        <label for="h-max-price">Total Harga Max.</label>
                        <input type="number" id="h-max-price" name="max_total_price" placeholder="Contoh: 3000000">
                    </div>
                    
                    <div class="form-group full-width">
                        <label for="h-segmentation">Kategori Hotel (Segmentation)</label>
                        <select id="h-segmentation" name="segmentation">
                            <option value="">Semua Kategori</option>
                            <option value="Budget">Budget</option>
                            <option value="Mid-range">Mid-range</option>
                            <option value="Luxury">Luxury</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label>Filter Bintang Hotel (Pilih Satu atau Lebih)</label>
                        <div class="star-rating">
                            <input type="checkbox" id="star1" name="hotel_star" value="1"><label for="star1">⭐ 1 Bintang</label>
                            <input type="checkbox" id="star2" name="hotel_star" value="2"><label for="star2">⭐ 2 Bintang</label>
                            <input type="checkbox" id="star3" name="hotel_star" value="3"><label for="star3">⭐ 3 Bintang</label>
                            <input type="checkbox" id="star4" name="hotel_star" value="4"><label for="star4">⭐ 4 Bintang</label>
                            <input type="checkbox" id="star5" name="hotel_star" value="5"><label for="star5">⭐ 5 Bintang</label>
                        </div>
                    </div>

                    <button type="submit" class="submit-button">Cari Hotel</button>
                </div>
            </form>
        </div>

        <div id="combo" class="tab-content">
            <form id="combo-form" onsubmit="runFilter(event, 'combo')">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="c-origin">Asal Penerbangan</label>
                        <input type="text" id="c-origin" name="origin" list="airport-list" placeholder="Ketik 'Surabaya' atau 'SUB'">
                    </div>
                    <div class="form-group">
                        <label for="c-destination">Tujuan Penerbangan (dan Kota Hotel)</label>
                        <input type="text" id="c-destination" name="destination" list="airport-list" placeholder="Ketik 'Jakarta' atau 'CGK'">
                    </div>
                    <div class="form-group full-width">
                        <label for="c-checkin-date">Tanggal Check-in Hotel</label>
                        <input type="date" id="c-checkin-date" name="checkin_date">
                    </div>
                    
                    <div class="form-group">
                        <label for="c-airline">Maskapai</label>
                        <select id="c-airline" name="airline">
                            <option value="">Semua Maskapai</option>
                            <option value="Garuda">Garuda Indonesia</option>
                            <option value="Lion">Lion Air</option>
                            <option value="Citilink">Citilink</option>
                            <option value="Batik">Batik Air</option>
                            <option value="AirAsia">AirAsia</option>
                            <option value="Super Air Jet">Super Air Jet</option>
                            <option value="Pelita">Pelita Air</option>
                            <option value="TransNusa">TransNusa</option>
                            <option value="Sriwijaya">Sriwijaya Air</option>
                            <option value="NAM">NAM Air</option>
                            <option value="Wings">Wings Air</option>
                            <option value="Scoot">Scoot</option>
                            <option value="Singapore">Singapore Airlines</option>
                            <option value="Malaysia">Malaysia Airlines</option>
                            <option value="Koninklijke">KLM</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="c-cluster">Kategori Paket</label>
                        <select id="c-cluster" name="cluster">
                            <option value="">Semua Kategori</option>
                            <option value="Budget">Budget</option>
                            <option value="Mid-range">Mid-range</option>
                            <option value="Business">Business</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="c-min-price">Total Harga Min.</label>
                        <input type="number" id="c-min-price" name="min_total_price" placeholder="Contoh: 1000000">
                    </div>
                    <div class="form-group">
                        <label for="c-max-price">Total Harga Max.</label>
                        <input type="number" id="c-max-price" name="max_total_price" placeholder="Contoh: 5000000">
                    </div>
                    <button type="submit" class="submit-button">Cari Paket Combo</button>
                </div>
            </form>
        </div>
    </div>

    <div class="results-container">
        <h2>Hasil Pencarian</h2>
        <div id="results-content">
            <p style="color: #888; grid-column: 1 / -1; text-align: center;">Hasil pencarian Anda akan tampil di sini.</p>
        </div>
    </div>

    <script>
        // --- GLOBAL VARIABLE ---
        window.currentResults = [];

        // Logo Perusahaan
        const COMPANY_LOGO_DATA = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAYAAAAeP4ixAAAABmJLR0QA/wD/AP+gvaeTAAAAjklEQVRogeaV0Q3DIAxE30yRjZAxMkY2SsdoF2iH0jFC6iJ1V4o45Q/8E58T24ADxEQ4q8Bq9zYAmN17B+AO4A0A5VzX3iO899m51lq/EyKl5BExM3POvfc+Iq613n8FQs65i4hZaz3/CoSUknfPzFprX3uP8N5n51prz/0XIGb2zrnn3nsfEbfW+v8ChJTyB95rJ8IqWz0RAAAAAElFTkSuQmCC";

        // --- FUNGSI HITUNG DURASI & VALIDASI (FIX 0 DURATION) ---
        function getDurationData(dep, arr) {
            if(!dep || !arr || dep === arr) return { valid: false, text: "Direct" }; // Invalid jika jam sama persis
            
            try {
                const [h1, m1] = dep.split(':').map(Number);
                const [h2, m2] = arr.split(':').map(Number);
                
                const startMins = h1 * 60 + m1;
                const endMins = h2 * 60 + m2;
                
                let diff = endMins - startMins;
                if (diff < 0) diff += 1440; // +1 Hari
                
                if (diff === 0) return { valid: false, text: "0h 0m" }; // Durasi 0 menit = Error Data

                const hours = Math.floor(diff / 60);
                const mins = diff % 60;
                
                return { valid: true, text: `${hours}h ${mins}m` };
            } catch (e) {
                return { valid: false, text: "-" };
            }
        }

        // --- FUNGSI DOWNLOAD PDF ---
        function confirmDownloadPDF(type, index) {
            const data = window.currentResults[index];
            if (!data) {
                if (typeof Swal !== 'undefined') Swal.fire('Error', 'Data tidak ditemukan.', 'error');
                else alert('Error: Data tidak ditemukan.');
                return;
            }

            if (typeof Swal !== 'undefined') {
                Swal.fire({
                    title: 'Download Penawaran?',
                    text: "Unduh detail penawaran ini dalam format PDF.",
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: '#007bff',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'Ya, Download!'
                }).then((result) => {
                    if (result.isConfirmed) generatePDF(type, data);
                });
            } else {
                if(confirm("Download PDF?")) generatePDF(type, data);
            }
        }

            return `https://loremflickr.com/400/300/hotel,building?random=${index}`;
        }

        function formatPrice(number) {
            const num = Number(number);
            if (isNaN(num) || num === 0) return number;
            const formattedNumber = new Intl.NumberFormat('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(num);
            return 'Rp. ' + formattedNumber;
        }

        function formatDate(timestamp) {
            if (!timestamp) return 'N/A';
            const date = new Date(Number(timestamp));
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}/${month}/${year}`;
        }

        function getBadgeColor(clusterName) {
            if (!clusterName) return '#999'; 
            const name = clusterName.toLowerCase();
            if (name.includes('luxury') || name.includes('business')) return '#4a148c'; 
            if (name.includes('mid') || name.includes('middle')) return '#007bff'; 
            if (name.includes('budget') || name.includes('economy')) return '#28a745'; 
            return '#ff6f00'; 
        }

        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
                tabcontent[i].classList.remove("active");
            }
            tablinks = document.getElementsByClassName("tab-link");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].classList.remove("active");
            }
            document.getElementById(tabName).style.display = "block";
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");

            const resultsContent = document.getElementById('results-content');
            resultsContent.innerHTML = '<p style="color: #888; grid-column: 1 / -1; text-align: center;">Hasil pencarian Anda akan tampil di sini.</p>';
            
            if (tabName === 'hotels') {
                resultsContent.classList.remove('list-mode');
            } else {
                resultsContent.classList.add('list-mode');
            }
        }

        async function runFilter(event, type) {
            event.preventDefault(); 
            const resultsContent = document.getElementById('results-content');
            resultsContent.innerHTML = `<div style="text-align:center; padding:20px; grid-column: 1/-1;"><p style="color: var(--primary-dark); font-weight: 600;">Sedang mencari penawaran terbaik...</p></div>`;

            let formId, apiEndpoint;
            if (type === 'flight') { formId = 'flight-form'; apiEndpoint = '/api/search-flights'; } 
            else if (type === 'hotel') { formId = 'hotel-form'; apiEndpoint = '/api/search-hotels'; } 
            else { formId = 'combo-form'; apiEndpoint = '/api/search-combo'; }

            const form = document.getElementById(formId);
            const formData = new FormData(form);
            let filterData = Object.fromEntries(formData.entries());
            if (type === 'hotel') {
                const starCheckboxes = form.querySelectorAll('input[name="hotel_star"]:checked');
                filterData.hotel_star = Array.from(starCheckboxes).map(cb => cb.value);
            }

            try {
                const response = await fetch(apiEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(filterData) 
                });
                const result = await response.json();

                if (result.success) {
                    const data = JSON.parse(result.data);
                    
                    // --- SIMPAN DATA KE GLOBAL VARIABLE UNTUK PDF ---
                    window.currentResults = data; 

                    if (type === 'flight') renderFlightCards(data);
                    else if (type === 'hotel') renderHotelCards(data);
                    else if (type === 'combo') renderComboCards(data); 

                } else {
                    resultsContent.innerHTML = `<p style="color: red; text-align:center; grid-column: 1/-1;">${result.message}</p>`;
                }
            } catch (error) {
                console.error('Error:', error);
                resultsContent.innerHTML = `<p style="color: red; text-align:center; grid-column: 1/-1;">Gagal terhubung ke server: ${error}</p>`;
            }
        }

        function toggleDetail(id) {

            }
        }
